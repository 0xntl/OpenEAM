# Continuous integration and delivery.
#
# Every push and pull request: install, lint, typecheck, build, and build both
# container images so a Dockerfile that no longer builds is caught here.
#
# Pushes to main and tags additionally publish the images to GHCR
# (ghcr.io/<owner>/openeam-api, …-web) and deploy them: main to staging, a
# v* tag to production. Deploys go through GitHub Environments — the
# `production` environment is set up to require a reviewer — over SSH to a
# key whose only allowed command is deploy/bin/deploy.sh, and whose only
# input is "<environment> <tag>". See deploy/README.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Check example bundle icons
        run: pnpm check:examples

      - name: Generate route tree (TanStack Router)
        run: pnpm --filter @openeam/web generate:routes

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

  images:
    name: Container image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `main` (moving), `sha-<7>` (immutable; what staging pins),
      # `v1.2.3` and `latest` on a release tag (what prod pins).
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openeam-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    needs: [check, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      url: https://${{ vars.OPENEAM_HOST }}
    concurrency:
      group: deploy-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
      cancel-in-progress: false

    steps:
      - name: Install deploy key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      # Staging pins the immutable sha-<7> tag of this commit, production the
      # release tag; both are what the images job just published.
      - name: Deploy
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          TARGET: ${{ github.ref_type == 'tag' && 'prod' || 'staging' }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
        run: |
          if [[ "$TAG" == sha-* ]]; then TAG="sha-${TAG:4:7}"; fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$HOST" "$TARGET $TAG"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
