# Serves the built SPA and proxies the API paths to the api container, so the
# browser sees a single origin. `api` resolves through Compose's network; set
# API_UPSTREAM-style overrides by editing this file if deploying elsewhere.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Import bundles can be a few MB.
  client_max_body_size 10m;

  # Security headers for the SPA. No CSP yet: index.html carries an inline
  # theme script and bpmn-js injects styles, so a useful policy needs hashes
  # or nonces first (docs/BACKLOG.md).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite emits hashed filenames under /assets; cache them indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~ ^/(graphql|health|api)(/|$) {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client-side routing: every other path is the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
